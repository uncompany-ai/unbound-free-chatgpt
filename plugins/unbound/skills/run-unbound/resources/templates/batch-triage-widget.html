<!--
  batch-triage-widget.html — pinned layout for the BATCH
  review.collect(checkpoint_view) call at run-unbound Step 3.5 (PLAN TRIAGE):
  ONE fragment for the whole plan, one card per retained task in priority
  order, ONE submit returning every verdict in a single turn. Single-item sites
  keep checkpoint-widget.html.

  NOT RESTATED HERE — fragment constraints, this surface's rules, and the batch
  sendPrompt grammar the footer handler implements: resources/tool-bindings.md
  ("Visualize protocol", "Interactive triage card stack", "sendPrompt
  grammar"). The P#/type/evidence style contract, the "inferred:" rule, and the
  {{P_*}}/{{TYPE_*}}/escaping vocabulary: task-plan-widget.html.

  TRIAGE-ONLY PLACEHOLDERS — {{ID}} the persisted task id (authoritative);
  {{ITEM_KEY}} the item slug; {{IDS_JSON}} the ordered id array fixing
  submission order; {{ITEM_NAME_FLATTENED}} the flattened item name;
  {{SOURCE_KIND}} ∈ email|call with {{SOURCE_DETAIL}} = sender or call_type.
  The typed `context` block is deliberately NOT rendered — triage is
  keep/kill/fix across N tasks; depth belongs to the output gate.

  ONE DELEGATED HANDLER on the card stack; per-card markup carries ZERO inline
  JS — verdict buttons bear only data-task + data-verdict and no style of their
  own (the sibling reset clears the whole attribute). It walks up from
  event.target by parentNode — no newer ancestor-matching DOM API is assumed
  here — and is INERT for a click carrying no data-verdict. No script element:
  its execution here is unobserved, where inline handlers are proven. On a
  verdict it records that verdict on window['__triage_{{ITEM_KEY}}'] (keyed by
  item slug, so two triage surfaces never share state), resets the sibling
  buttons' styling, applies the verdict's color trio (green accept / gray edit
  / red reject), sets "Selected: <Verdict>", and shows+focuses the -note input
  for edit / hides it otherwise.
-->
<div>
<h2 class="sr-only">{{SR_DESCRIPTION}}</h2>
<div style="display:flex;flex-direction:column;gap:10px;" onclick="var e=event.target,v;while(e&&e!==this){v=e.getAttribute&&e.getAttribute('data-verdict');if(v)break;e=e.parentNode;}if(!v)return;var C={accept:['green','#E3F3E5','#1E6B32','Accept'],edit:['gray','#F1EFE8','#444441','Edit'],reject:['red','#FBE7E6','#8A2A22','Reject']}[v];if(!C)return;var t=e.getAttribute('data-task'),g=e.parentNode.getElementsByTagName('button'),n=document.getElementById(t+'-note');(window['__triage_{{ITEM_KEY}}']=window['__triage_{{ITEM_KEY}}']||{})[t]=v;for(var i=0;i&lt;g.length;i++)g[i].removeAttribute('style');e.style.cssText='background:var(--c-'+C[0]+'-50,'+C[1]+');color:var(--c-'+C[0]+'-800,'+C[2]+');font-weight:600';document.getElementById(t+'-status').textContent='Selected: '+C[3];n.style.display=v==='edit'?'block':'none';if(v==='edit')n.focus();">

<!-- CARD — repeat per retained task, in priority order. -->
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;">

  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
    <span style="background:var(--c-{{P_COLOR}}-50,{{P_BG}});color:var(--c-{{P_COLOR}}-800,{{P_FG}});font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;">{{P_BADGE}}</span>
    <span style="background:var(--c-{{TYPE_COLOR}}-50,{{TYPE_BG}});color:var(--c-{{TYPE_COLOR}}-800,{{TYPE_FG}});font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;">{{TYPE_LABEL}}</span>
    <span style="font-weight:500;font-size:15px;margin-left:2px;">{{TITLE}}</span>
  </div>

  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px;">{{RATIONALE}}</p>

  <div style="border-top:0.5px solid var(--border);padding-top:8px;margin-bottom:10px;">
    <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin:0 0 4px;">Evidence &middot; {{SOURCE_KIND}} ({{SOURCE_DETAIL}})</p>
    <p style="font-size:13px;color:var(--text-primary);margin:0;font-style:italic;">{{EVIDENCE_QUOTE}}</p>
  </div>

  <!-- CONTROLS — the handler's only targets; this parent is the reset scope. -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button data-task="{{ID}}" data-verdict="accept">Accept</button>
    <button data-task="{{ID}}" data-verdict="edit">Edit</button>
    <button data-task="{{ID}}" data-verdict="reject">Reject</button>
  </div>
  <p id="{{ID}}-status" style="font-size:12px;color:var(--text-muted);margin:6px 0 0;min-height:15px;"></p>
  <input id="{{ID}}-note" type="text" placeholder="What should change about this task?" style="display:none;width:100%;margin-top:8px;box-sizing:border-box;">

</div>
<!-- / END CARD -->

<!-- FOOTER — ONCE, after the last card. -->
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px;">
  <p style="font-size:12px;color:var(--text-muted);margin:0;">Cards you leave untouched record nothing.</p>
  <button onclick="var V=window['__triage_{{ITEM_KEY}}']||{};var ids={{IDS_JSON}};var p=[];for(var i=0;i&lt;ids.length;i++){var id=ids[i];var v=V[id];if(!v){continue;}if(v==='edit'){var n=document.getElementById(id+'-note').value;if(!n){continue;}p.push(id+': edit: '+n);}else{p.push(id+': '+v);}}if(p.length){sendPrompt('Verdicts for {{ITEM_NAME_FLATTENED}} — '+p.join('; '));}" style="border-color:var(--border-accent, var(--border-strong));">Submit verdicts</button>
</div>

</div>
</div>
