<!--
  ═══════════════════════════════════════════════════════════════════════════
  artifact-widget.html — pinned layout contract for `render.artifact(artifact_view)`.

  Generic artifact-preview template — the default render capability every
  `execute` handler inherits per task-registry.md Part B's Output-edit
  obligation (runtime/tool-bindings.md `## render.artifact`). Rendered as ONE
  visualize widget fragment per artifact: one top-level <div>, first child
  h2.sr-only (widget-fragment constraints, resources/tool-bindings.md
  "Visualize protocol"). Inline styles only; Cowork CSS vars with hex
  fallbacks.

  A read-only preview of the artifact file the handler already wrote —
  nothing is regenerated or altered at render time. `artifact_view` =
  { kind, title, filename, body_blocks[], source_task }; the FILENAME IS ALSO
  CITED IN CHAT alongside the widget, the same pattern `render.email_draft`
  already uses. `kind` is a short label naming the artifact type (e.g.
  `architecture_spec`) — card framing only, never a dispatch key.
  `body_blocks[]` is the artifact's content, chunked for display — SHAPED
  LIKE ITSELF (the same principle `render.context_preview`'s
  `drafted_content` already states), not a literal HTML dump.

  LAYOUT (fixed order): header row (kind label + title + filename, amber
  "draft · not applied" pill) · content area (one block per body_blocks[]
  entry, rendered as paragraphs/lists, HTML-escaped: &amp;, &mdash;, …) ·
  verdict footer.

  RENDER/CAPTURE — this widget both presents the artifact and collects its
  verdict. The artifact and the decision on it live on ONE surface (act
  where you read); no separate checkpoint card follows it. Fallback surface
  (cited filename + body_blocks[] content in chat, same three verdicts
  invited in chat) carries the same fields — ADR-1 field parity.

  sendPrompt GRAMMAR (verdicts — see resources/tool-bindings.md "sendPrompt grammar"):
    Accept button (accent border = primary action) → sendPrompt('Accept task {{ID}} ({{TITLE_FLATTENED}})')
    Reject button                                  → sendPrompt('Reject task {{ID}} ({{TITLE_FLATTENED}})')
    Edit input + Submit                            → sendPrompt('Edit task {{ID}}: ' + value), ONLY when value is non-empty
    This is the EXISTING per-item verdict grammar — no second grammar is
    introduced here. {{ID}} is the artifact's `source_task` (the persisted
    task id) and is AUTHORITATIVE; {{TITLE}} is the view's `title`,
    legibility only. {{TITLE_FLATTENED}}: flatten `'` and `"` out of the
    parenthesized title so the handler stays valid JS.

  A CLICK WRITES NOTHING (ADR-9) — the sent prompt IS the return-to-agent
  turn, and hand-typing the same text is equivalent. The footer is NOT a
  send affordance: an Edit rewrites the local artifact file (the handler's
  own `apply-<artifact>-edit`) and nothing is ever applied, sent, or
  renamed — the amber "draft · not applied" pill stays exactly where it is
  and states that boundary at every cycle.
  ═══════════════════════════════════════════════════════════════════════════
-->
<div>
<h2 class="sr-only">{{SR_DESCRIPTION}}</h2>
<!-- {{SR_DESCRIPTION}} names the artifact's title, its kind, the not-applied
     state, AND the available actions for screen readers, e.g.
     "Draft architecture spec 'Acme Corp Integration Plan', not yet applied,
      with accept, reject, and edit actions" -->
<div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1.25rem;">

  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
    <div>
      <p style="font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-muted); margin:0 0 2px;">{{KIND_LABEL}}</p>
      <p style="font-size:14px; font-weight:500; margin:0;">{{TITLE}}</p>
      <p style="font-size:12px; color:var(--text-muted); margin:2px 0 0;">{{FILENAME}}</p>
    </div>
    <span style="background:var(--c-amber-50,#FAEEDA); color:var(--c-amber-800,#633806); font-size:11px; font-weight:500; padding:3px 10px; border-radius:999px; white-space:nowrap;">draft &middot; not applied</span>
  </div>

  <div style="border-top:0.5px solid var(--border); padding-top:10px; font-size:13px; line-height:1.6; color:var(--text-primary);">
    <!--
      CONTENT AREA — one block per body_blocks[] entry, shaped like itself:
        paragraph:   <p style="margin:0 0 10px;">…</p>
        list:        <ul style="margin:0 0 10px; padding-left:18px;"><li>…</li></ul>
        final block: <p style="margin:0;">…</p>
    -->
    {{BODY_BLOCKS}}
  </div>

  <!--
    VERDICT FOOTER — the artifact's own Accept / Reject / Edit controls, on
    the same card as the artifact they judge. Same markup and grammar as
    render.email_draft's footer; {{ID}} is the artifact's `source_task`.
  -->
  <div style="border-top:0.5px solid var(--border); padding-top:14px; margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
    <button onclick="sendPrompt('Accept task {{ID}} ({{TITLE_FLATTENED}})')" style="border-color:var(--border-accent, var(--border-strong));">Accept</button>
    <button onclick="sendPrompt('Reject task {{ID}} ({{TITLE_FLATTENED}})')">Reject</button>
  </div>
  <div style="display:flex; gap:8px; margin-top:8px;">
    <input id="{{ID}}-edit" type="text" placeholder="Propose an edit to this artifact instead" style="flex:1;">
    <button onclick="var v=document.getElementById('{{ID}}-edit').value; if(v){sendPrompt('Edit task {{ID}}: ' + v);}">Submit edit</button>
  </div>

</div>
</div>
